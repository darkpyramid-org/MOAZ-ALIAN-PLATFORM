name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Package builds
        run: |
          mkdir -p release-assets
          tar -czf release-assets/api-dist.tar.gz -C apps/api dist prisma package.json
          tar -czf release-assets/dashboard-dist.tar.gz -C apps/dashboard .output package.json
          tar -czf release-assets/public-dist.tar.gz -C apps/public .output package.json

      - name: Validate and determine tag name
        id: vars
        env:
          # Keep untrusted workflow_dispatch input out of the shell program.
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag. Expected vMAJOR.MINOR.PATCH with an optional prerelease/build suffix."
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "::error::Release tag does not exist in the checked-out repository."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: false
\\n'* || "$RELEASE_TAG" == *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: false
\\r'* || ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag. Expected vMAJOR.MINOR.PATCH with an optional prerelease/build suffix."
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "::error::Release tag '$RELEASE_TAG' does not exist in the checked-out repository."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: false
