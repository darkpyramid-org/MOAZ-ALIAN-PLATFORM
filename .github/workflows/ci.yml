name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend API (lint / typecheck / test / build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moaz
          POSTGRES_PASSWORD: moaz_dev
          POSTGRES_DB: moaz_alian
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://moaz:moaz_dev@localhost:5432/moaz_alian?schema=library
      TEST_DATABASE_URL: postgresql://moaz:moaz_dev@localhost:5432/moaz_alian?schema=library
      AUTH_JWT_SECRET: ci-jwt-secret-minimum-32-characters-test-value-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @moaz/api prisma:generate

      - name: Prisma migrate deploy
        run: pnpm --filter @moaz/api db:migrate

      - name: Typecheck
        run: pnpm --filter @moaz/api typecheck

      - name: Lint
        run: pnpm --filter @moaz/api lint

      - name: Unit tests
        run: pnpm --filter @moaz/api test

      - name: Build API
        run: pnpm --filter @moaz/api build

  frontend-public:
    name: Public Site (lint / test / build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @moaz/public lint

      - name: Format check
        run: pnpm --filter @moaz/public format:check

      - name: Unit tests
        run: pnpm --filter @moaz/public test

      - name: Build public site
        run: pnpm --filter @moaz/public build

  frontend-dashboard:
    name: Dashboard (lint / test / build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @moaz/dashboard lint

      - name: Format check
        run: pnpm --filter @moaz/dashboard format:check

      - name: Unit tests
        run: pnpm --filter @moaz/dashboard test

      - name: Build dashboard
        run: pnpm --filter @moaz/dashboard build

  packages:
    name: Shared Packages (build / verify)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep scanning CRITICAL/HIGH findings visible in SARIF, then fail the
      # required security gate after the upload step has had a chance to run.
      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy scan results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Prove that the configured severity threshold actually blocks a known
      # vulnerable dependency. The fixture is created in the runner temp dir,
      # outside the repository scan above, so it cannot poison normal scans.
      - name: Create known-vulnerable Trivy policy fixture
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-policy-fixture"
          cat > "$RUNNER_TEMP/trivy-policy-fixture/package-lock.json" <<'JSON'
          {
            "name": "trivy-policy-fixture",
            "version": "1.0.0",
            "lockfileVersion": 2,
            "requires": true,
            "packages": {
              "": {
                "name": "trivy-policy-fixture",
                "version": "1.0.0",
                "dependencies": {
                  "lodash": "4.17.20"
                }
              },
              "node_modules/lodash": {
                "version": "4.17.20",
                "resolved": "https://registry.npmjs.org/lodash/-/lodash-4.17.20.tgz"
              }
            },
            "dependencies": {
              "lodash": {
                "version": "4.17.20",
                "resolved": "https://registry.npmjs.org/lodash/-/lodash-4.17.20.tgz"
              }
            }
          }
          JSON

      - name: Verify Trivy blocks a known HIGH vulnerability
        id: trivy-policy-fixture
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/trivy-policy-fixture
          format: table
          output: ${{ runner.temp }}/trivy-policy-fixture-results.txt
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Assert Trivy policy fixture is rejected
        if: always()
        env:
          FIXTURE_OUTCOME: ${{ steps.trivy-policy-fixture.outcome }}
        run: |
          if [ "$FIXTURE_OUTCOME" != "failure" ]; then
            echo "::error::Trivy did not reject the known-vulnerable fixture."
            exit 1
          fi
          if ! grep -q "CVE-2021-23337" "$RUNNER_TEMP/trivy-policy-fixture-results.txt"; then
            echo "::error::Trivy failed without reporting the expected CVE-2021-23337 finding."
            exit 1
          fi
          echo "Trivy correctly rejected the known HIGH-severity fixture."

      - name: Enforce Trivy policy
        if: always()
        env:
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          if [ "$TRIVY_OUTCOME" != "success" ]; then
            echo "::error::Trivy scan failed or found CRITICAL/HIGH vulnerabilities."
            exit 1
          fi
          echo "Trivy scan completed without CRITICAL/HIGH findings."

  automation:
    name: Issue triage classifier tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate issue triage rules
        run: node --test scripts/issue-triage.test.cjs

  ci-status:
    name: CI All Checks Status
    needs: [backend, frontend-public, frontend-dashboard, packages, security, automation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI jobs status
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend-public.result }}" != "success" ] || \
             [ "${{ needs.frontend-dashboard.result }}" != "success" ] || \
             [ "${{ needs.packages.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.automation.result }}" != "success" ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All monorepo CI checks passed successfully!"
