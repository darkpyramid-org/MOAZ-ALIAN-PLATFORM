name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-frontend:
    name: Frontend (lint / format / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moaz-alian

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test

  build-frontend:
    name: Frontend build
    needs: test-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moaz-alian
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: moaz-alian/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Security (Trivy) — disabled for now
  # The previous job failed at "Set up job" (org / GITHUB_TOKEN policy).
  # Re-enable when the org allows security-events: write for Actions.
  # ---------------------------------------------------------------------------
