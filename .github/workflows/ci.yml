name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Required for Trivy SARIF upload to the Security tab
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Frontend (moaz-alian) — only package that exists in the repo today
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Frontend (lint / format / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moaz-alian

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        # package.json "format" is write-only; use prettier --check for CI
        run: bunx prettier --check .

      - name: Unit tests
        run: bun run test

  build-frontend:
    name: Frontend build
    needs: test-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moaz-alian
    # Only build artifacts on main (or when explicitly needed)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: moaz-alian/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Security scan (filesystem)
  # ---------------------------------------------------------------------------
  security:
    name: Security (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report only; do not fail the job on findings yet

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Placeholder for future backend (api-server does not exist yet)
  # Uncomment / adapt when the backend package is added to the monorepo.
