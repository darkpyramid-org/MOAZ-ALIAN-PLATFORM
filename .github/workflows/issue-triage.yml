name: Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: Auto-label & triage new issues
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'open'

    steps:
      - name: Apply triage labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const text = `${title}\n${body}`;

            const labelsToAdd = new Set();

            // Only newly opened issues enter the human-triage queue.
            if (context.payload.action === 'opened') {
              labelsToAdd.add('needs-triage');
            }

            // Type and security labels.
            if (/\b(bug|broken|crash|error|fail|regression|fix)\b/.test(text)) {
              labelsToAdd.add('bug');
            }
            if (/\b(feature|enhancement|request|improve|add support)\b/.test(text)) {
              labelsToAdd.add('enhancement');
            }
            if (/\b(doc|documentation|readme|guide)\b/.test(text)) {
              labelsToAdd.add('documentation');
            }
            if (/\b(security|vulnerab|cve|auth|jwt|xss|csrf|injection|secret|password|oauth)\b/.test(text)) {
              labelsToAdd.add('security');
            }

            // Prefer an explicit priority declaration; support common P-level aliases.
            const explicitPriority = text.match(/\bpriority\s*[:=-]?\s*(critical|high|medium|low)\b/);
            if (explicitPriority) {
              labelsToAdd.add(`priority: ${explicitPriority[1]}`);
            } else if (/\b(p0|sev0|blocker)\b/.test(text)) {
              labelsToAdd.add('priority: critical');
            } else if (/\b(p1|sev1)\b/.test(text)) {
              labelsToAdd.add('priority: high');
            } else if (/\b(p2|sev2)\b/.test(text)) {
              labelsToAdd.add('priority: medium');
            } else if (/\b(p3|sev3)\b/.test(text)) {
              labelsToAdd.add('priority: low');
            }

            // Area labels. Match repository paths and domain terms without malformed regexes.
            if (/\b(api|backend|express|prisma|endpoint)\b|\/api\//.test(text) || text.includes('apps/api')) {
              labelsToAdd.add('area:api');
            }
            if (/\b(public|frontend|ssr|tanstack start)\b/.test(text) || text.includes('apps/public')) {
              labelsToAdd.add('area:public');
            }
            if (/\b(dashboard|editorial|admin panel)\b/.test(text) || text.includes('apps/dashboard')) {
              labelsToAdd.add('area:dashboard');
            }
            if (/\b(package|shared|ui package|api-client|shared-types)\b/.test(text) || text.includes('packages/')) {
              labelsToAdd.add('area:packages');
            }
            if (/\b(ci|github actions|workflow|pipeline|trivy)\b/.test(text) || text.includes('.github/')) {
              labelsToAdd.add('area:ci');
            }
            if (/\b(docs|documentation|readme|setup guide|architecture guide)\b/.test(text) || text.includes('docs/')) {
              labelsToAdd.add('area:docs');
            }

            // Create custom labels on demand so a missing label cannot break triage.
            const definitions = {
              'needs-triage': { color: 'ededed', description: 'Needs initial human review' },
              'security': { color: 'd73a4a', description: 'Security-related issue' },
              'priority: critical': { color: 'b60205', description: 'Must be fixed immediately' },
              'priority: high': { color: 'd93f0b', description: 'High priority' },
              'priority: medium': { color: 'fbca04', description: 'Medium priority' },
              'priority: low': { color: '0e8a16', description: 'Low priority / nice-to-have' },
              'area:api': { color: '1d76db', description: 'Backend API (apps/api)' },
              'area:public': { color: '1d76db', description: 'Public frontend' },
              'area:dashboard': { color: '1d76db', description: 'Editorial dashboard' },
              'area:packages': { color: '1d76db', description: 'Shared packages' },
              'area:ci': { color: '1d76db', description: 'CI and GitHub Actions' },
              'area:docs': { color: '1d76db', description: 'Documentation' },
              'bug': { color: 'd73a4a', description: 'Something is not working' },
              'enhancement': { color: 'a2eeef', description: 'New feature or improvement' },
              'documentation': { color: '0075ca', description: 'Documentation improvements' },
            };

            for (const name of labelsToAdd) {
              const definition = definitions[name];
              if (!definition) {
                core.warning(`No label definition registered for "${name}"`);
                continue;
              }

              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;

                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: definition.color,
                    description: definition.description,
                  });
                } catch (createError) {
                  // Concurrent issue events may create the same label. Treat
                  // only that already-exists race as success, then verify it.
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.getLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                  });
                }
              }
            }

            const existing = new Set((issue.labels || []).map((label) => label.name));
            const toAdd = [...labelsToAdd].filter((name) => !existing.has(name));

            if (toAdd.length === 0) {
              core.info('No new labels to apply');
              return;
            }

            core.info(`Adding labels: ${toAdd.join(', ')}`);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: toAdd,
            });
