name: Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: Auto-label & triage new issues
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'open'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate issue triage rules
        run: node --test scripts/issue-triage.test.cjs

      - name: Apply triage labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { classifyIssue, LABEL_DEFINITIONS } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/issue-triage.cjs`
            );
            const labelsToAdd = new Set(classifyIssue(issue, context.payload.action));

            // Create custom labels on demand so a missing label cannot break triage.
            for (const name of labelsToAdd) {
              const definition = LABEL_DEFINITIONS[name];
              if (!definition) {
                core.warning(`No label definition registered for "${name}"`);
                continue;
              }

              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;

                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: definition.color,
                    description: definition.description,
                  });
                } catch (createError) {
                  // Concurrent issue events may create the same label. Treat
                  // only that already-exists race as success, then verify it.
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.getLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                  });
                }
              }
            }

            const existing = new Set((issue.labels || []).map((label) => label.name));
            const toAdd = [...labelsToAdd].filter((name) => !existing.has(name));

            if (toAdd.length === 0) {
              core.info('No new labels to apply');
              return;
            }

            core.info(`Adding labels: ${toAdd.join(', ')}`);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: toAdd,
            });
